<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --headC:#171a2b;
  --bodyC:#4b4f61;
  --bodyB:#fffdfc;
  --pageB:#f7f3f6;
  --linkC:#5b4fe0;
  --linkB:#5b4fe0;
  --sideBrd:#eee9ea;
  --fontH:'Inter',Arial,Helvetica,sans-serif;
  --fontBa:'Inter',Arial,Helvetica,sans-serif;
  --synxBg:#f6f6f6;
  --lostBg:#efecfb;
  --lostC:#5b4fe0;
  --lostDot:#7669f0;
  --frameA:#5b4fe0;
  --frameB:#c9c3f7;
  --frameC:#eee9ea;
  --frameD:#f6f6f6;
}

@media (prefers-color-scheme: dark){
  :root{
    --headC:#f2f0f7;
    --bodyC:#b7b6c4;
    --bodyB:#121018;
    --pageB:#17151f;
    --sideBrd:#2a2733;
    --synxBg:#1d1a26;
    --lostBg:#211d33;
    --lostC:#9a90f5;
    --lostDot:#8377ef;
    --frameA:#8377ef;
    --frameB:#332c52;
    --frameC:#2a2733;
    --frameD:#1d1a26;
  }
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--fontBa);
  background:var(--bodyB);
  color:var(--bodyC);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  min-height:100vh;
  overflow-x:hidden;
}

main{
  width:100%;
  max-width:560px;
  text-align:center;
}

.lostBadge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:var(--lostBg);
  color:var(--lostC);
  font-size:.8rem;
  font-weight:600;
  padding:7px 16px;
  border-radius:20px;
  margin-bottom:30px;
}
.lostDot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--lostDot);
  flex-shrink:0;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }

/* ===== signature: a film strip scrolling behind a "missing frame" viewport ===== */
.reel{
  position:relative;
  height:150px;
  margin-bottom:26px;
}

.filmstrip{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:100vw;
  max-width:900px;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to right, transparent, black 18%, black 82%, transparent);
  mask-image:linear-gradient(to right, transparent, black 18%, black 82%, transparent);
}
.filmstrip-track{
  display:flex;
  align-items:center;
  gap:14px;
  width:max-content;
  animation:scrollStrip 22s linear infinite;
}
.frame{
  width:78px;
  height:104px;
  border-radius:10px;
  flex-shrink:0;
  position:relative;
  background:linear-gradient(160deg, var(--frameC), var(--frameD));
  overflow:hidden;
}
.frame::before, .frame::after{
  content:'';
  position:absolute;
  left:8px; right:8px;
  height:4px;
  border-radius:2px;
  background:var(--sideBrd);
}
.frame::before{ top:9px; }
.frame::after{ bottom:9px; }
.frame span{
  position:absolute;
  inset:16px 8px;
  border-radius:6px;
  display:block;
  opacity:.9;
}
.frame:nth-child(4n+1) span{ background:linear-gradient(135deg, var(--frameA), var(--frameB)); }
.frame:nth-child(4n+2) span{ background:linear-gradient(135deg, var(--frameB), var(--frameC)); }
.frame:nth-child(4n+3) span{ background:linear-gradient(135deg, var(--frameC), var(--frameA)); opacity:.55; }
.frame:nth-child(4n+4) span{ background:linear-gradient(135deg, var(--frameA), var(--frameC)); opacity:.75; }

@keyframes scrollStrip{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}

/* the fixed "viewport" card sitting on top, styled like .vidCard from the portfolio */
.viewport{
  position:relative;
  z-index:2;
  width:130px;
  height:150px;
  margin:0 auto;
  border-radius:14px;
  background:var(--bodyB);
  box-shadow:0 14px 30px -12px rgba(0,0,0,.3);
  border:1px solid var(--sideBrd);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:6px;
}
.viewport .num{
  font-family:var(--fontH);
  font-weight:800;
  font-size:1.7rem;
  color:var(--headC);
  line-height:1;
}
.viewport .tag{
  font-size:.62rem;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--lostC);
}
.viewport .icon{
  width:24px;
  height:24px;
  opacity:.6;
  animation:search 3.6s ease-in-out infinite;
}
.viewport .icon svg{
  width:100%;
  height:100%;
  stroke:var(--bodyC);
  fill:none;
  stroke-width:1.8;
}
@keyframes search{
  0%   { transform:translate(0,0) rotate(0deg); }
  20%  { transform:translate(-3px,-2px) rotate(-8deg); }
  40%  { transform:translate(2px,2px) rotate(6deg); }
  60%  { transform:translate(3px,-2px) rotate(8deg); }
  80%  { transform:translate(-2px,2px) rotate(-6deg); }
  100% { transform:translate(0,0) rotate(0deg); }
}

h1{
  font-family:var(--fontH);
  font-weight:400;
  color:var(--headC);
  font-size:clamp(1.7rem, 4.2vw, 2.3rem);
  line-height:1.3;
  margin:0 0 12px;
  letter-spacing:-0.02em;
}
h1 strong{ font-weight:700; }

p{
  font-size:.95rem;
  line-height:1.7;
  margin:0 0 30px;
  color:var(--bodyC);
}
.path-chip{
  display:inline-block;
  background:var(--synxBg);
  border:1px solid var(--sideBrd);
  border-radius:6px;
  padding:2px 8px;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:.82rem;
  color:var(--headC);
  word-break:break-all;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}

a.button{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--linkB);
  color:#fffdfc;
  padding:12px 22px;
  border-radius:24px;
  font-size:.88rem;
  font-weight:600;
  text-decoration:none;
  transition:opacity .2s ease, transform .2s ease;
}
a.button:hover{ opacity:.9; transform:translateY(-1px); }

a.ghost{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--bodyB);
  border:1px solid var(--sideBrd);
  color:var(--headC);
  padding:12px 22px;
  border-radius:24px;
  font-size:.88rem;
  font-weight:600;
  text-decoration:none;
  font-family:var(--fontBa);
  transition:border-color .2s ease, color .2s ease, transform .2s ease;
}
a.ghost:hover{ border-color:var(--linkC); color:var(--linkC); transform:translateY(-1px); }

a.button:focus-visible,
a.ghost:focus-visible{
  outline:2px solid var(--linkC);
  outline-offset:3px;
}

@media (prefers-reduced-motion: reduce){
  .filmstrip-track, .lostDot, .viewport .icon{ animation:none !important; }
}

@media screen and (max-width:480px){
  .reel{ height:130px; }
  .viewport{ width:110px; height:130px; }
  .frame{ width:66px; height:88px; }
}
</style>
</head>
<body>

  <main>
    <div class="lostBadge"><span class="lostDot"></span>Frame not found</div>

    <div class="reel">
      <div class="filmstrip">
        <div class="filmstrip-track" id="track"></div>
      </div>
      <div class="viewport">
        <div class="num">404</div>
        <div class="icon">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="21" y2="21"/></svg>
        </div>
        <div class="tag">Missing</div>
      </div>
    </div>

    <h1>This page <strong>didn't make the final cut</strong></h1>

    <p>
      There's nothing at <span class="path-chip" id="path"></span>.
      It may have been moved, renamed, or never existed.
    </p>

    <div class="actions">
      <a href="/" class="button">Back to portfolio →</a>
      <a href="javascript:history.back()" class="ghost">Go back</a>
    </div>
  </main>

  <script>
    document.getElementById('path').textContent = window.location.pathname;

    // build enough frames to fill the strip twice over, for a seamless infinite scroll
    const track = document.getElementById('track');
    const frameCount = 24;
    let html = '';
    for (let i = 0; i < frameCount * 2; i++) {
      html += '<div class="frame"><span></span></div>';
    }
    track.innerHTML = html;
  </script>

</body>
</html>
